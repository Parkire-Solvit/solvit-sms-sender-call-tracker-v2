# Nginx Server Block Configuration for Solvit SLA & Compliance Tracker

server {
    listen 80;
    server_name tracker.solvit.co.ke; # Replace with your domain

    root /var/www/solvit-tracker/php;
    index index.php index.html;

    charset utf-8;

    # Gzip Compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Handle API routes through index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to FastCGI server
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock; # Adjust PHP-FPM version if needed
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "date.timezone=Africa/Nairobi";
    }

    # Deny access to sensitive files
    location ~ /\.ht {
        deny all;
    }
    location ~ \.(sqlite|sql|env|log)$ {
        deny all;
    }
}
