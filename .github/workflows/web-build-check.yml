name: Web Build Check

on:
  push:
    branches: [feat/v3-alignment, fix/email-inbox-reconciliation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check (tsc --noEmit)
        run: npm run lint
      - name: Build (vite + esbuild)
        run: npm run build
